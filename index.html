<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --c0:#FDFAF5;--c1:#F7F1E8;--c2:#EDE3D2;--c3:#D9C8AE;--c4:#C4A97A;
  --gold:#B8924A;--gold-l:#E8D5A8;--gold-d:#7A5E28;--gold-text:#6B4F1E;
  --ink:#1C1208;--ink2:#4A3420;--ink3:#8A6E50;--ink4:#B09070;
  --line:#E8DFD0;--line2:#D4C8B4;
  --warn:#A84C42;--warn-bg:#F7E9E6;--warn-text:#8A3B32;
  --ok-bg:#E9EEE0;--ok-text:#4E6140;
  --shadow:0 2px 6px rgba(28,18,8,.05),0 14px 34px rgba(28,18,8,.07);
  --scrim:rgba(28,18,8,.42);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c0:#15100A;--c1:#1D1712;--c2:#291F16;--c3:#3B2C1B;--c4:#6E5533;
    --gold:#D9B26F;--gold-l:#3A2C18;--gold-d:#E3C589;--gold-text:#E3C589;
    --ink:#F3EBDC;--ink2:#DACBAE;--ink3:#B7A489;--ink4:#8C7A5F;
    --line:#3A2E1E;--line2:#4B3B24;
    --warn:#E39184;--warn-bg:#2E1E1A;--warn-text:#EBB3A8;
    --ok-bg:#1F2618;--ok-text:#A9BE92;
    --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --c0:#15100A;--c1:#1D1712;--c2:#291F16;--c3:#3B2C1B;--c4:#6E5533;
  --gold:#D9B26F;--gold-l:#3A2C18;--gold-d:#E3C589;--gold-text:#E3C589;
  --ink:#F3EBDC;--ink2:#DACBAE;--ink3:#B7A489;--ink4:#8C7A5F;
  --line:#3A2E1E;--line2:#4B3B24;
  --warn:#E39184;--warn-bg:#2E1E1A;--warn-text:#EBB3A8;
  --ok-bg:#1F2618;--ok-text:#A9BE92;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.55);
}
html,body{background:var(--c0)}
html{-webkit-text-size-adjust:100%}
body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);display:flex;justify-content:center;padding:1.6rem 1rem calc(3rem + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
@media(min-width:640px){body{padding:2.2rem 1rem 4rem}}
.disp{font-family:'Fraunces',Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{width:100%;max-width:760px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Hero ---- */
.eyebrow{font-family:-apple-system,sans-serif;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-text);display:flex;align-items:center;gap:.6rem;margin-bottom:1.3rem}
.ornament{flex:1;height:1px;background:linear-gradient(to right,var(--gold),transparent)}
.hero{background:var(--c1);border:1px solid var(--line);border-radius:24px;padding:1.5rem 1.5rem 1.6rem;margin-bottom:.7rem}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.9rem}
.hero-name{font-size:13px;color:var(--ink3);font-style:italic}
.icon-btn{background:var(--c0);border:1px solid var(--line2);color:var(--ink3);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-text)}
.hero-main{display:flex;align-items:center;gap:1.1rem}
.hero-figpic{width:66px;height:66px;flex-shrink:0;color:var(--gold-d)}
.hero-week{font-size:56px;font-weight:400;line-height:.9;color:var(--ink);letter-spacing:-.01em}
.hero-week sup{font-size:20px;color:var(--gold-text);top:-.8em}
.trimester{font-family:-apple-system,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-text);background:var(--c0);border:1px solid var(--line2);padding:.25rem .6rem;border-radius:20px;display:inline-block;margin-top:.45rem}
.hero-size{font-size:14.5px;color:var(--ink2);margin-top:.9rem}
.hero-size b{color:var(--gold-text);font-weight:400;font-style:italic}
.progress-track{margin-top:1.1rem;height:3px;background:var(--c2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(to right,var(--gold-l),var(--gold));border-radius:2px;transition:width .5s ease}
.progress-label{display:flex;justify-content:space-between;margin-top:.5rem;font-family:-apple-system,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4)}
.appt-pill{margin-top:.9rem;display:flex;align-items:center;gap:.5rem;font-family:-apple-system,sans-serif;font-size:11.5px;color:var(--gold-text);background:var(--c0);border:1px solid var(--line2);padding:.45rem .8rem;border-radius:12px;width:fit-content}

/* ---- Settings ---- */
.settings-panel{display:none;background:var(--c0);border:1px solid var(--line2);border-radius:16px;padding:1.1rem;margin-top:1rem}
.settings-panel.open{display:block}
.settings-row{display:flex;gap:.65rem;flex-wrap:wrap;margin-bottom:.7rem}
.sfield{display:flex;flex-direction:column;gap:4px;flex:1;min-width:135px}
.sfield label{font-family:-apple-system,sans-serif;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4)}
.sfield input,.sfield textarea{border:1px solid var(--line2);border-radius:9px;padding:.75rem .7rem;font-size:16px;color:var(--ink);font-family:Georgia,serif;background:var(--c1);outline:none;width:100%;resize:vertical}
.sfield input:focus,.sfield textarea:focus{border-color:var(--gold)}
.settings-div{height:1px;background:var(--line);margin:1rem 0 .9rem}
.settings-note{font-family:-apple-system,sans-serif;font-size:10.5px;color:var(--ink4);margin-top:.5rem;line-height:1.6}
.save-btn{font-family:-apple-system,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.03em;background:var(--gold);color:#fff;border:none;border-radius:9px;padding:.55rem 1.1rem;cursor:pointer;margin-top:.6rem}
.save-btn:hover{background:var(--gold-d);color:var(--c0)}
.set-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.set-import{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;color:var(--gold-text);background:var(--c1);border:1px dashed var(--line2);border-radius:9px;padding:.55rem 1.1rem;cursor:pointer;margin-top:.6rem;min-height:38px}
.set-import:hover{border-color:var(--gold)}
.set-msg{font-size:11.5px;color:var(--ok-text);background:var(--ok-bg);border-radius:8px;padding:.5rem .7rem;margin-bottom:.2rem}

/* ---- Tagebuch ---- */
.jq{background:var(--c1);border:1px solid var(--line);border-radius:20px;padding:1.1rem 1.15rem;margin-bottom:.7rem}
.jq-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.7rem;margin-bottom:.7rem}
.jq-title{font-size:15px;color:var(--ink)}
.jq-sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);margin-top:2px}
.jq-link{font-size:11.5px;font-weight:600;color:var(--gold-text);background:none;border:1px solid var(--line2);border-radius:20px;padding:.55rem .85rem;cursor:pointer;white-space:nowrap;min-height:40px}
.jq-link:hover{border-color:var(--gold)}
.jq-note{width:100%;border:1px solid var(--line2);border-radius:12px;padding:.7rem .8rem;font-family:Georgia,serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--c0);outline:none;resize:vertical;min-height:62px}
.jq-note:focus{border-color:var(--gold)}
.jq-meas{display:flex;gap:.5rem;margin-top:.6rem}
.jq-field{flex:1;display:flex;flex-direction:column;gap:3px}
.jq-field label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4)}
.jq-field input{border:1px solid var(--line2);border-radius:10px;padding:.7rem .65rem;font-size:16px;font-family:Georgia,serif;color:var(--ink);background:var(--c0);outline:none;width:100%}
.jq-field input:focus{border-color:var(--gold)}
.jq-hint{font-size:10.5px;color:var(--ink4);margin-top:.55rem;line-height:1.5}

function gestation(){
  const due = new Date(settings.dueDate+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  let daysPregnant = 280 - Math.round((due-today)/86400000);
  daysPregnant = Math.max(0, Math.min(300,daysPregnant));
  const week = Math.floor(daysPregnant/7);
  const day = daysPregnant%7;
  const daysLeft = Math.max(0, Math.round((due-today)/86400000));
  const trimester = week<14?1:(week<28?2:3);
  return {week,day,daysLeft,trimester,due};
}
/* ---- Tagebuch ---- */
function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function weekForDate(iso){
  const due=new Date(settings.dueDate+'T00:00:00'), d=new Date(iso+'T00:00:00');
  let dp = 280 - Math.round((due-d)/86400000);
  dp = Math.max(0,Math.min(300,dp));
  return {w:Math.floor(dp/7), d:dp%7};
}
function dayLabel(iso){
  const d=new Date(iso+'T00:00:00'), t=new Date(todayISO()+'T00:00:00');
  const diff=Math.round((t-d)/86400000);
  if(diff===0) return 'Heute';
  if(diff===1) return 'Gestern';
  return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'});
}
function entry(iso){ return journal[iso] || (journal[iso]={}); }
function saveJournal(){
  try{ localStorage.setItem(LS_JOU,JSON.stringify(journal)); return true; }
  catch(e){ journalMsg='Speicher voll – bitte ein älteres Foto löschen.'; return false; }
}
function setJ(iso,field,val){
  const e=entry(iso);
  if(val===''||val==null) delete e[field]; else e[field]=val;
  if(!Object.keys(e).length) delete journal[iso];
  saveJournal(); render();
}
function setJNum(iso,field,val){
  const n=parseFloat(String(val).replace(',','.'));
  setJ(iso,field, (val===''||isNaN(n))?'':n);
}
function addPhoto(iso,input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=900, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const data=cv.toDataURL('image/jpeg',0.72);
      const e=entry(iso); const old=e.photo; e.photo=data;
      if(!saveJournal()){ if(old) e.photo=old; else delete e.photo; }
      else journalMsg='';
      render();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function removePhoto(iso){
  const e=journal[iso]; if(!e) return;
  delete e.photo;
  if(!Object.keys(e).length) delete journal[iso];
  journalMsg=''; saveJournal(); render();
}
function journalDays(){ return Object.keys(journal).sort().reverse(); }
function measurePoints(field){
  return journalDays().map(iso=>({iso, w:weekForDate(iso).w, v:journal[iso][field]}))
    .filter(p=>typeof p.v==='number' && p.w>=4 && p.w<=42)
    .sort((a,b)=>a.w-b.w);
}

/* Kleines Liniendiagramm: eine Messreihe, optional eine Referenzkurve */
function lineChart(opts){
  const pts=opts.points; if(pts.length<1) return '';
  const W=320,H=150,ml=34,mr=10,mt=12,mb=22;
  const iw=W-ml-mr, ih=H-mt-mb;
  const xMin=4, xMax=40;
  const refArr = opts.ref ? Object.keys(opts.ref).map(k=>({w:+k,v:opts.ref[k]})).filter(p=>p.w>=xMin&&p.w<=xMax) : [];
  const allV = pts.map(p=>p.v).concat(refArr.map(p=>p.v));
  const vMax = Math.max.apply(null,allV)*1.1 || 1;
  const X=w=>ml+((w-xMin)/(xMax-xMin))*iw;
  const Y=v=>mt+ih-(v/vMax)*ih;
  const refPath = refArr.length ? refArr.map((p,i)=>(i?'L':'M')+X(p.w).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ') : '';
  const linePath = pts.map((p,i)=>(i?'L':'M')+X(p.w).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const dots = pts.map(p=>`<circle cx="${X(p.w).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="var(--gold)" stroke="var(--c0)" stroke-width="2"/>`).join('');
  const last = pts[pts.length-1];
  const lx = X(last.w), ly = Y(last.v);
  const anchor = lx > ml+iw*0.7 ? 'end' : 'start';
  const lastLabel = `<text x="${(anchor==='end'?lx-8:lx+8).toFixed(1)}" y="${(ly-10).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="600" fill="var(--gold-text)" font-family="-apple-system,sans-serif">${esc(last.v+' '+opts.unit)}</text>`;
  const ticks=[10,20,30,40].map(w=>`<text x="${X(w).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--ink4)" font-family="-apple-system,sans-serif">${w}</text>`).join('');
  const yTicks=[0,vMax/2,vMax].map(v=>
    `<line x1="${ml}" y1="${Y(v).toFixed(1)}" x2="${W-mr}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
     <text x="${ml-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--ink4)" font-family="-apple-system,sans-serif">${Math.round(v)}</text>`).join('');
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.title)}">
      ${yTicks}
      ${refPath?`<path d="${refPath}" fill="none" stroke="var(--ink4)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".65"/>`:''}
      <path d="${linePath}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${lastLabel}${ticks}
      <text x="${ml}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--ink4)" font-family="-apple-system,sans-serif">SSW</text>
    </svg>
    <div class="chart-legend sans">
      <span><i class="sw-gold"></i>Eure Messungen</span>
      ${refPath?'<span><i class="sw-ref"></i>Typischer Verlauf</span>':''}
    </div>
  </div>`;
}

function dayIndex(){
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);
}
function todaysQuote(tri){
  const pool = QUOTES_ALL.concat(QUOTES_TRI[tri]||[]);
  return pool[dayIndex() % pool.length];
}
function allCompliments(){

  return list[(dayIndex()+2) % list.length];
}

/* ---- Entwicklungsdarstellung ----
   Die Kopf-Körper-Proportion ist das, was sich real am stärksten ändert:
   früh macht der Kopf fast die Hälfte aus, zum Termin etwa ein Viertel. */
const FET_STAGES = [
  {to:6,  hr:15, bx:11, by:15, limb:0,  tail:true, from:'4', label:'Embryo, C-förmig gekrümmt', detail:'Kopf- und Schwanzende sind kaum zu unterscheiden. Das Herz liegt als Wölbung vorn.'},
  {to:9,  hr:16, bx:15, by:17, limb:6,  tail:true, from:'7',   label:'Arm- und Beinknospen', detail:'Die Gliedmaßen sprießen als kleine Paddel, der Schwanzfortsatz bildet sich zurück.'},
  {to:13, hr:17, bx:18, by:19, limb:11, from:'10', label:'Menschliche Form', detail:'Finger und Zehen sind getrennt. Der Kopf macht noch rund die Hälfte der Länge aus.'},
  {to:20, hr:16, bx:21, by:21, limb:15, from:'14', label:'Fötus, schlank', detail:'Arme und Beine werden länger, die Proportionen verschieben sich Richtung Körper.'},
  {to:30, hr:15, bx:24, by:23, limb:17, from:'21', label:'Rundlich, Hände am Gesicht', detail:'Fettpolster entstehen, das Baby greift und tastet, oft mit den Händen vorm Gesicht.'},
  {to:99, hr:14, bx:27, by:25, limb:18, from:'31', label:'Reif, eng zusammengerollt', detail:'Kaum noch Platz: Arme und Beine sind fest angezogen, der Kopf liegt meist unten.'},
];
function fetStage(w){ return FET_STAGES.find(s=>w<=s.to) || FET_STAGES[FET_STAGES.length-1]; }

function fetusSVG(week,uid){
  const s = fetStage(week);
  const id = 'vol'+(uid||'x');
  const lw = Math.max(4, s.limb*0.42);
  const limbs = s.limb ? `
    <path d="M50 57q${(s.limb*0.55).toFixed(1)} ${(s.limb*0.3).toFixed(1)} ${(s.limb*0.72).toFixed(1)} ${(s.limb*0.62).toFixed(1)}" fill="none" stroke="var(--gold-d)" stroke-width="${lw.toFixed(1)}" stroke-linecap="round" opacity=".9"/>

    <circle cx="58" cy="34" r="${s.hr}" fill="url(#${id})" stroke="var(--gold-d)" stroke-width="1.6"/>

  </svg>`;
}

    <div class="jq-hint sans">Größe und Gewicht nach dem Arzttermin eintragen – daraus entsteht eure Wachstumskurve.</div>
  </div>`;
}

function journalEntryCard(iso,open){
  const e=journal[iso]||{}, g=weekForDate(iso);
  const chips=[];
  if(e.babyLen!=null) chips.push(`<span class="chip info">${e.babyLen} cm</span>`);
  if(e.babyWeight!=null) chips.push(`<span class="chip info">${e.babyWeight} g</span>`);
  if(e.photo) chips.push(`<span class="chip limit">Bild</span>`);
  return `<div class="jday ${open?'open':''}">
    <div class="jday-head" onclick="toggleCard('jour_${iso}')">
      <div>
        <div class="jday-date">${dayLabel(iso)}</div>
        <div class="jday-ssw sans">SSW ${g.w}+${g.d}</div>
      </div>
      <div class="jday-chips">${chips.join('')}</div>
    </div>
    ${open?`<div class="jday-body">
      ${e.photo?`<div class="jphoto"><img src="${e.photo}" alt="Bild vom ${esc(dayLabel(iso))}"><button class="jphoto-del" onclick="removePhoto('${iso}')">Bild entfernen</button></div>`:''}
      <textarea class="jq-note" placeholder="Notiz für diesen Tag" onchange="setJ('${iso}','note',this.value)">${esc(e.note||'')}</textarea>
      <div class="jq-meas">
        <div class="jq-field"><label class="sans">Größe (cm)</label><input inputmode="decimal" placeholder="—" value="${e.babyLen!=null?e.babyLen:''}" onchange="setJNum('${iso}','babyLen',this.value)"></div>
        <div class="jq-field"><label class="sans">Gewicht (g)</label><input inputmode="decimal" placeholder="—" value="${e.babyWeight!=null?e.babyWeight:''}" onchange="setJNum('${iso}','babyWeight',this.value)"></div>
      </div>
      <label class="jphoto-add sans">${ICONS.plus} Ultraschallbild hinzufügen
        <input type="file" accept="image/*" onchange="addPhoto('${iso}',this)" hidden>
      </label>
    </div>`:''}
  </div>`;
}

function renderJournal(){
  const iso=todayISO(), g=weekForDate(iso);
  const days=journalDays();
  const lenPts=measurePoints('babyLen'), wPts=measurePoints('babyWeight');
  const list = days.length
    ? days.map(d=>journalEntryCard(d, !!openCards['jour_'+d])).join('')
    : '<div class="jempty">Noch keine Einträge. Schreib oben etwas zu heute – ab morgen kannst du hier zurückblättern.</div>';
  return `<div class="jhero">
      <div class="jhero-art">${fetusSVG(Math.max(4,Math.min(40,g.w)),'jour')}</div>
      <div>
        <div class="jhero-w disp">SSW ${g.w}+${g.d}</div>
        <div class="jhero-t">${esc(fetStage(g.w).label)} – stilisierte Darstellung, kein Ultraschallbild.</div>
      </div>
    </div>
    ${journalMsg?`<div class="fb-toast" style="background:var(--warn-bg);color:var(--warn-text)">${esc(journalMsg)}</div>`:''}
    <div class="group-label">Heute eintragen</div>
    ${journalEntryCard(iso,true)}
    ${(lenPts.length||wPts.length)?`<div class="group-label">Wachstumskurve</div>`:''}
    ${lenPts.length?`<div class="chart-title sans">Größe in cm</div>${lineChart({points:lenPts,ref:REF_LEN,unit:'cm',title:'Größe des Babys in cm nach Schwangerschaftswoche'})}
      <div class="chart-note">Der Sprung um SSW 21 ist kein Fehler: Bis dahin wird vom Scheitel bis zum Steiß gemessen, danach bis zur Ferse.</div>`:''}
    ${wPts.length?`<div class="chart-title sans">Gewicht in Gramm</div>${lineChart({points:wPts,unit:'g',title:'Gewicht des Babys in Gramm nach Schwangerschaftswoche'})}`:''}
    <div class="group-label">Alle Tage${days.length?' · '+days.length:''}</div>
    ${list}`;
}

/* ---- Sheets ---- */
const SHEETS = {
  journal:{title:'Tagebuch',art:'bookopen',body:renderJournal},
  weeks:{title:'Dein Wochenverlauf',art:'melon',body:renderWeeks},
  warnings:{title:'Wann sofort anrufen',art:'phone',body:()=>renderFlat('warnings',WARNINGS)},
  complaints:{title:'Beschwerden & was hilft',art:'flame',body:()=>renderFlat('complaints',COMPLAINTS)},
  supp:{title:'Nahrungsergänzung',art:'leaf',body:()=>renderGrouped('supp',SUPPLEMENTS)},
  foodavoid:{title:'Lebensmittel',art:'fish',body:()=>renderFlat('foodavoid',AVOID_FOOD)},
  actavoid:{title:'Alltag & Aktivitäten',art:'thermo',body:()=>renderFlat('actavoid',AVOID_ACTIVITY)},
  meds:{title:'Medikamente',art:'tablet',body:()=>renderGrouped('meds',MEDS)},
  vaccines:{title:'Impfungen',art:'syringe',body:()=>renderFlat('vaccines',VACCINES)},
  sport:{title:'Sport & Beckenboden',art:'blossom',body:renderSport},
  mutterpass:{title:'Mutterpass verstehen',art:'passport',body:()=>renderFlat('mutterpass',MUTTERPASS)},
  ultrasound:{title:'Ultraschallbilder',art:'camera',body:()=>renderFlat('ultrasound',ULTRASOUND)},
  shopping:{title:'Anschaffungen',art:'stroller',body:renderShopping},
  travel:{title:'Reisen',art:'plane',body:()=>renderFlat('travel',TRAVEL)},
  checklist:{title:'Checkliste',art:'calendar',body:renderChecklist},
  pkv:{title:'Privat versichert',art:'babyshield',body:()=>renderFlat('pkv',PKV)},
  babysleep:{title:'Sicherer Babyschlaf',art:'crib',body:()=>renderFlat('babysleep',BABYSLEEP)},
  care:{title:'Kita oder Tagesmutter',art:'kids',body:()=>renderFlat('care',CARE)},
  afterbirth:{title:'Nach der Geburt',art:'stamp',body:()=>renderFlat('afterbirth',AFTERBIRTH)},
  sources:{title:'Alle Quellen',art:'receipt',body:renderSources},
};

function renderSheet(g){
  const meta = activeSheet ? SHEETS[activeSheet] : null;
  return `<div class="scrim ${activeSheet?'open':''}" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-hdr">
        <div class="sheet-hdr-icon" style="padding:6px">${meta?art(meta.art):''}</div>
        <div class="sheet-title">${meta?meta.title:''}</div>
        <button class="sheet-close" onclick="closeSheet()" aria-label="Schließen">✕</button>
      </div>
      <div class="sheet-body">${meta?meta.body(g):''}</div>
    </div>
  </div>`;
}

function shero(arts,text,src){
  return `<div class="shero">
    <div class="shero-arts">
      <div class="a1">${art(arts[0])}</div>
      <div class="a2">${art(arts[1])}</div>
      <div class="a3">${art(arts[2])}</div>
    </div>
    <div class="shero-text">${text}${srcLink(src)}</div>
  </div>`;
}

function mcard(key,it){
  const open = !!openCards[key];
  return `<div class="mcard ${open?'open':''}" data-card="${key}" onclick="toggleCard('${key}')">
    <div class="mcard-art">${art(it.art)}</div>
    <div class="mcard-title">${esc(it.t)}</div>
    ${it.chip?`<div class="chip ${it.chip[0]}">${esc(it.chip[1])}</div>`:''}
    <div class="mcard-short">${esc(it.short||'')}</div>
    <div class="mcard-more">Mehr ansehen →</div>
    <div class="mcard-detail">${it.text||''}
      <div>${videoLinks(it.video)}</div>
      ${srcLink(it.src)}
    </div>
  </div>`;
}

function renderFlat(key,data){
  return shero(data.heroArt,data.intro,data.introSrc)
    + `<div class="cardgrid">${data.items.map((it,i)=>mcard(key+i,it)).join('')}</div>`
    + (data.warn?`<div class="warnbox"><b>Wichtig</b>${data.warn}${srcLink(data.warnSrc)}</div>`:'');
}

function renderGrouped(key,data){
  const groups = data.groups.map((gr,gi)=>
    `<div class="group-label">${gr.label}</div>
     <div class="cardgrid">${gr.items.map((it,i)=>mcard(key+gi+'_'+i,it)).join('')}</div>`
  ).join('');
  return shero(data.heroArt,data.intro,data.introSrc) + groups
    + (data.warn?`<div class="warnbox"><b>Wichtig</b>${data.warn}${srcLink(data.warnSrc)}</div>`:'');
}

function renderSport(){
  return shero(SPORT.heroArt,SPORT.intro,SPORT.introSrc)
    + `<div class="group-label">Bewegung nach Trimester</div>
       <div class="cardgrid">${SPORT.phases.map((p,i)=>mcard('sport'+i,p)).join('')}</div>
       <div class="group-label">Beckenboden</div>
       <div class="cardgrid">${mcard('sportpelvic',SPORT.pelvic)}</div>
       <div class="warnbox"><b>Sofort abbrechen bei</b>${SPORT.warn}${srcLink(SPORT.warnSrc)}</div>`;
}

function renderWeeks(g){
  const now = Math.max(4,Math.min(40,g.week));
  const list = WEEKS.filter(x=>{
    if(triFilter===0)return true;
    if(triFilter===1)return x.w<14;
    if(triFilter===2)return x.w>=14 && x.w<28;
    return x.w>=28;
  });
  const rows = list.map(x=>`<div class="week-row ${x.w===now?'now':''}">
    <div class="week-pic">${art(x.icon)}</div>
    <div class="week-content">
      <div class="week-heading">
        <span class="week-num disp">SSW ${x.w}</span>
        <span class="week-size">${esc(x.size)} · ${x.len}</span>
        ${x.w===now?'<span class="now-badge sans">Jetzt</span>':''}
      </div>
      <div class="week-text">${x.t}</div>
      ${srcLink(x.src)}
    </div>
  </div>`).join('');
  const tris = [['Alle',0],['1. Trimester',1],['2. Trimester',2],['3. Trimester',3]];
  const curStage = fetStage(now);
  const strip = FET_STAGES.map((s,i)=>`<div class="strip-item ${s===curStage?'now':''}">
      <div class="strip-fig">${fetusSVG([6,9,13,20,30,40][i],'s'+i)}</div>
      <div class="strip-w sans">SSW ${esc(s.from)}${s.to<99?'–'+s.to:'+'}</div>
    </div>`).join('');
  return `${stagePanel(g)}
    <div class="group-label">Die Stadien im Überblick</div>
    <div class="strip">${strip}</div>
    <div class="group-label">Woche für Woche</div>
    <div class="tri-nav">${tris.map(t=>`<button class="tri-btn ${triFilter===t[1]?'active':''}" onclick="setTri(${t[1]})">${t[0]}</button>`).join('')}</div>
    ${rows}
    <div style="margin-top:1rem">${srcLink(['msd_fetal','gesundheit_gv_at','swissmom_5ssw','helios_wochen'])}</div>`;
}

function renderShopping(){
  const rows = SHOPPING.list.map(it=>{
    const on = !!checks[it.id];
    const price = it.price ? it.price.toLocaleString('de-DE')+' €' : '—';
    return `<div class="buy-row ${on?'on':''}">
      <div class="chk-box ${on?'on':''}" onclick="toggleCheck('${it.id}')"></div>
      <div class="buy-info" onclick="toggleCheck('${it.id}')">
        <div class="buy-name">${esc(it.t)}</div>
        <div class="buy-note sans">${esc(it.note)} · ${esc(it.phase)}</div>
      </div>
      <div class="buy-price sans">${price}</div>
      <a class="buy-link" href="${it.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Produkt ansehen" aria-label="Produkt ansehen">↗</a>
    </div>`;
  }).join('');
  const total = SHOPPING.list.reduce((s,i)=>s+(i.price||0),0);
  const done = SHOPPING.list.filter(i=>checks[i.id]).length;
  return shero(SHOPPING.heroArt,SHOPPING.intro,SHOPPING.introSrc)
    + `<div class="group-label">Zeitplan</div>
       <div class="cardgrid">${SHOPPING.phases.map((p,i)=>mcard('shop'+i,p)).join('')}</div>
       <div class="group-label">Eure Liste · ${done} von ${SHOPPING.list.length} besorgt</div>
       <div class="buy-intro">${SHOPPING.listIntro}</div>
       ${rows}
       <div class="buy-total"><span class="sans">Gesamt</span><span class="buy-total-val">${total.toLocaleString('de-DE')} €</span></div>
       <div class="warnbox" style="background:var(--c1);border-color:var(--line2);color:var(--ink3)"><b>Hinweis</b>${SHOPPING.note}</div>`;
}

function renderChecklist(){
  const items = CHECKLIST.map(it=>{
    const on = !!checks[it.id];
    return `<div class="chk-row ${on?'on':''}" onclick="toggleCheck('${it.id}')">
      <div class="chk-box ${on?'on':''}"></div>
      <div class="chk-label">${it.t}</div>
    </div>`;
  }).join('');
  return `<div class="info-line">Gesetzlich Versicherte haben Anspruch auf mindestens 10 Vorsorgeuntersuchungen: bis SSW 32 etwa alle 4 Wochen, danach alle 2 Wochen. Drei Ultraschall-Screenings sind vorgesehen – etwa in SSW 8–12, 18–22 und 28–32.${srcLink(['familienplanung_vorsorge','gba_murl'])}</div>
    ${items}
    <div style="margin-top:1rem">${srcLink(['familienplanung_klinik'])}</div>`;
}

function renderSources(){
  const list = SOURCES_ALL.map(([id,s],i)=>`<div class="src-item"><span class="src-num sans">${String(i+1).padStart(2,'0')}</span><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></div>`).join('');
  return `<div class="info-line">Jede fachliche Aussage in dieser App stammt aus einer dieser Quellen – Behörden, Fachgesellschaften und anerkannte medizinische Portale.</div><div class="src-list">${list}</div>`;
}

/* ============ INTERAKTION ============ */
function openSheet(id){ activeSheet=id; openCards={}; render(); }
function closeSheet(){ activeSheet=null; render(); }
function setTri(n){ triFilter=n; render(); }
function toggleCard(key){
  openCards[key] = !openCards[key];
  scrollToCard = openCards[key] ? key : null;
  render();
}
function toggleSettings(){ settingsOpen=!settingsOpen; render(); }
function updateSetting(k,v){ settings[k]=v; lsSet(LS_SET,settings); render(); }
function toggleCheck(id){ checks[id]=!checks[id]; lsSet(LS_CHK,checks); render(); }
/* ---- Sicherung ---- */
const LS_KEYS=[LS_SET,LS_CHK,LS_JOU];
function exportData(){
  try{
    const data={};
    LS_KEYS.forEach(k=>{const v=localStorage.getItem(k); if(v!=null) data[k]=v;});
    const blob=new Blob([JSON.stringify({app:'unsere-reise',exported:new Date().toISOString(),data},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='unsere-reise-sicherung-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    settingsMsg='Sicherung heruntergeladen.';
  }catch(e){ settingsMsg='Sicherung fehlgeschlagen.'; }
  render();
}
function importData(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const obj=JSON.parse(ev.target.result), d=obj&&obj.data;
      if(!d||typeof d!=='object') throw new Error('Format');
      let n=0;
      Object.keys(d).forEach(k=>{ if(k.indexOf('preg_')===0){ localStorage.setItem(k,d[k]); n++; } });
      settings=Object.assign({dueDate:'2027-05-20',name:'',nextAppt:''},lsGet(LS_SET,{}));
      checks=lsGet(LS_CHK,{}); journal=lsGet(LS_JOU,{});
      settingsMsg=n?'Sicherung eingelesen – alles wiederhergestellt.':'Datei enthielt keine Daten.';
    }catch(e){ settingsMsg='Datei konnte nicht gelesen werden.'; }
    render();
  };
  r.readAsText(f);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape' && activeSheet) closeSheet(); });

/* Das Dokument wird in eine fremde Seite eingebettet – dadurch landen die
   Icon-Tags im Body. iOS liest sie aber nur aus dem echten <head>. */
(function moveIconTagsToHead(){
  try{
    if(!document.head) return;
    document.querySelectorAll(
      'link[rel="apple-touch-icon"],link[rel="icon"],meta[name^="apple-mobile-web-app"]'
    ).forEach(el=>{ if(el.parentNode!==document.head) document.head.appendChild(el); });
    if(document.title!=='Unsere Reise') document.title='Unsere Reise';
  }catch(e){}
})();

render();
</script>
